task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case14_ieee
  scenarios:
  - 250000
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 0
  split_by_load_scenario_idx: false
  split_from_existing_files: data/pfdelta_ft/splits_hard
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 5.0e-05
  optimizer_params:
    betas:
    - 0.9
    - 0.999
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.5
    patience: 2
training:
  batch_size: 64
  epochs: 30
  loss_weights:
  - 0.1
  - 0.9
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: cpu
  devices: 1
  strategy: auto
seed: 0
verbose: true
callbacks:
  patience: 5
  tol: 0
version: 1
